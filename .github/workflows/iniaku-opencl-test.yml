# OpenCL Quantus kernel vs CPU (bit-exact) on PoCL (OpenCL on the CPU), no GPU needed.
name: iniaku-opencl-test

on:
  push:
    branches: [iniaku, "opencl-*"]
    paths: ["crates/engine-opencl/**", ".github/workflows/iniaku-opencl-test.yml"]
  workflow_dispatch:

jobs:
  pocl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PoCL + OpenCL loader
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd ocl-icd-libopencl1 clinfo && clinfo -l; clinfo | grep -iE "platform name|device name|device type" | head
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Test engine-opencl
        run: |
          cargo test --release -p engine-opencl -- --nocapture 2>&1 | tee test.log
          grep -q "test result: ok. 2 passed" test.log
          ! grep -q "skipping:" test.log
