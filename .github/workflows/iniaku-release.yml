# quantus-iniaku (crates/stratum-miner): Quantus pool miner for iniaku-miner.
# - push to branch iniaku / workflow_dispatch: build, packages as artifacts
# - push tag v*-iniaku*: same, then GitHub release (tags with "beta" are pre-releases)
name: iniaku-release

on:
  push:
    branches: [iniaku]
    tags: ["v*-iniaku*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Ubuntu 20.04 (glibc 2.31): HiveOS and Ubuntu 20.04+
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential pkg-config git
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked -p stratum-miner
      - name: Package
        run: |
          v=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//; s#/#-#g')
          name="quantus-iniaku-$v-linux-x64"
          mkdir -p "dist/$name"
          cp target/release/quantus-iniaku LICENSE "dist/$name/"
          cp iniaku/README.txt "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.sha256

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain file)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        shell: bash
        run: RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked -p stratum-miner
      - name: Package
        shell: bash
        run: |
          v=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//; s#/#-#g')
          name="quantus-iniaku-$v-windows-x64"
          mkdir -p "dist/$name"
          cp target/release/quantus-iniaku.exe LICENSE "dist/$name/"
          sed 's/$/\r/' iniaku/README.txt > "dist/$name/README.txt"
          cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null && sha256sum "$name.zip" > "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          body: |
            quantus-iniaku — Quantus (QTC) pool miner used by iniaku-miner, built on the official
            Quantus engines (CPU, wgpu/Vulkan, CUDA) with the LuckyPool stratum dialect.
            Fee: 2% of the mining time. See README.txt. Apache-2.0, based on Quantus-Network/quantus-miner.
